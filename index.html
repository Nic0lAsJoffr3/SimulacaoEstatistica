<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação Estatistica</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            background-image: linear-gradient(180deg, #121212 50%, #15202B);
        }

        .InputDiv {
            position: absolute;
            margin: 25vh 35vw 35vh 35vw;
            width: 30vw;
            height: 40vh;
            background-color: #181818b2;
            box-shadow: #192a3b 0px 0px 15px;
            border-radius: 20px;
        }

        .InputDiv button,
        .InputDiv input {
            border: none;
            padding: 0;
            margin: 0 20% 0 20%;
            width: 60%;
            height: 5vh;
            border-radius: 15px;
            position: absolute;
        }
        h1,h2{
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            padding: 0;
            position: absolute;
            text-align: center;
            width: 100%;
        }
        h1{
            top: 0;
            font-size: 25px;
        }
        h2{
            font-size: 20px;
            top: 100px;
        }

        .InputDiv input {
            margin: 30% 40% 0 40%;
            height: 20%;
            width: 20%;
            text-align: center;
            font-size: 30px;
            background-color: #202020;
            color: white;
            border: #15202B 1px solid;
        }

        .InputDiv button {
            font-family: Arial, Helvetica, sans-serif;
            bottom: 50px;
            font-size: 30px;
            background-color: rgb(31, 146, 20);
            color: #ffffff;
            text-shadow: 0px 0px 1px black;
        }

        .InputDiv button:focus,
        .InputDiv input:focus {
            border: none;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="InputDiv">
        <h1>Simulador de Distribuição Uniforme Contínua</h1>
        <h2>Quantidade de barras</h2>
        <input value="15" id="inputNumber" type="number"> 
        <button onclick="Start()">Gerar Simulação</button>
    </div>
</body>
<script>
    if (window.innerWidth < 900 || window.innerWidth < window.innerHeight) {

        document.body.innerHTML = `
    
    <div style="
        color:#B2B2B2;
        font-family:Arial;
        display:block;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-size:20px;
        text-align:center;
        background:#121212;
    ">
        Não Disponivel para <b> Celular</b><br>
        Acesse 
        <i><a style="color:white; font-size:20px;" href="https://nic0lasjoffr3.github.io/SimulacaoEstatistica/">https://nic0lasjoffr3.github.io/SimulacaoEstatistica/</a></i>
        , em um <b>Computador</b>

    </div>
    
    `;
    }
    
    function Start(){
        var sizeBar = document.getElementById("inputNumber").value;
    window.location.href = `desenhar.html?sizeBar=${sizeBar}`;
    }
</script>

</html>
